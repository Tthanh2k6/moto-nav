; Firmware màn hình dẫn đường MotoNav cho bo ESP32-2432S028R ("Cheap Yellow Display").
;   pio run -e cyd                          biên dịch
;   pio run -e cyd -t upload --upload-port COM3
;   pio device monitor -p COM3 -b 115200
; Thư viện lib/motonav_core là C++17 thuần (không Arduino), dùng chung với chương trình kiểm trên PC (test_host/).
[env:cyd]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    lovyan03/LovyanGFX@1.2.7
    h2zero/NimBLE-Arduino@2.3.0
build_unflags = -std=gnu++11 -Os
; -ffp-contract=off: KHÔNG gộp a*b+c thành lệnh madd.s của ESP32, nếu gộp thì phép tính Float lệch bit so với JVM
; -fwrapv: số nguyên tràn thì quay vòng như Int của Kotlin
build_flags =
    -std=gnu++17
    -O2
    -ffp-contract=off
    -fwrapv
    -DCORE_DEBUG_LEVEL=0
