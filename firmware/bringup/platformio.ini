; Chương trình thử phần cứng cho bo ESP32-2432S028R ("Cheap Yellow Display").
; Hai biến thể màn: phần lớn bo dùng chip ILI9341; bản có 2 cổng USB thường dùng ST7789.
;   pio run -e ili9341 -t upload      (thử cái này trước)
;   pio run -e st7789  -t upload      (nếu màn trắng / màu sai hẳn)
[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps = lovyan03/LovyanGFX@1.2.7

[env:cyd]
